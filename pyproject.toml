[project]
name = "src"
version = "0.2.0"
description = "Code to convert the [arXiv Dataset](https://www.kaggle.com/datasets/Cornell-University/arxiv) from JSON to an SQLite3 database"
authors = [{ name = "Nicholas M. Synovic", email = "nicholas.synovic@gmail.com" }]
requires-python = "~=3.10"
readme = "README.md"
license = "GNU Affero"
keywords = ["dataset"]
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = [
    "kaggle>=1.6.17,<2",
    "sqlalchemy>=2.0.32,<3",
    "pandas>=2.2.2,<3",
    "progress~=1.6",
    "click>=8.1.7,<9",
]

[project.urls]
Homepage = "https://github.com/NicholasSynovic/tool_arXiv-db"
Repository = "https://github.com/NicholasSynovic/tool_arXiv-db"

[project.scripts]
arXiv-DB = "arxiv_db.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
